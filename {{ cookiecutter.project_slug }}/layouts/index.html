{{ define "main" }}
  {{ .Content }}
  <ul class="tabular col1 h-feed">
    {{ range .RegularPages }}
      <li class="h-entry">
        <a class="u-url p-name" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </li>
    {{ end }}
    {{ range .Sections }}
    <h2>{{ .Title }}</h2>
      {{ range .RegularPages }}
        <li class="h-entry">
          <a class="u-url p-name" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </li>
      {{ end }}
    {{ end }}
  </ul>
{{ end }}
